<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arty's Snake</title>
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="stylesheet" href="style/popup.css">
    <link rel="stylesheet" href="style/grid.css">
    <link rel="stylesheet" href="style/style.css">
</head>

<body>
    <div id="popupWelcome" class="popup hide">
        <div class="welcome-popup-container">
            <div class="popup-item align-content-center">Welcome to Arty's Snake!</div>
            <div class="popup-item">
                <button class="popup-button" type="button" onclick="app.reset()">Start</button>
            </div>
        </div>
    </div>
    <div id="popupGameover" class="popup hide">
        <div class="gameover-popup-container">
            <div class="popup-item align-content-end">Game Over!</div>
            <div class="popup-item align-content-center">Score: <span id="scoreLoss"></span></div>
            <div class="popup-item">
                <button class="popup-button" type="button" onclick="app.reset()">Try Again</button>
            </div>
        </div>
    </div>
    <div id="popupWin" class="popup hide">
        <div class="gameover-popup-container">
            <div class="popup-item align-content-end">You Win!</div>
            <div class="popup-item align-content-center">Score: <span id="scoreWin"></span></div>
            <div class="popup-item">
                <button class="popup-button" type="button" onclick="app.reset()">Play Again</button>
            </div>
        </div>
    </div>
    <div class="container"></div>
    <audio id="soundEat" class="hide" preload="auto">
        <source src="assets/eat1.mp3" type="audio/mpeg" />
    </audio>
    <audio id="soundGameOver" class="hide" preload="auto">
        <source src="assets/gameover.mp3" type="audio/mpeg" />
    </audio>
    <audio id="soundWin" class="hide" preload="auto">
        <source src="assets/win.mp3" type="audio/mpeg" />
    </audio>
    <script src="js/util.js"></script>
    <script src="js/orderedSoundPlayer.js"></script>
    <script src="js/script.js"></script>
</body>

</html>
