<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artys Snake</title>
    <link rel="icon" href="favicon.svg" sizes="any" type="image/svg+xml">
    <link rel="stylesheet" href="style/popup.css">
    <link rel="stylesheet" href="style/grid.css">
    <link rel="stylesheet" href="style/style.css">
</head>

<body>
    <div id="popupWelcome" class="popup hide">
        <div class="welcome-popup-container">
            <div class="popup-item align-content-center">Welcome to Arys Snake!</div>
            <div class="popup-item">
                <button class="popup-button" type="button">Start</button>
            </div>
        </div>
    </div>
    <div id="popupGameover" class="popup hide">
        <div class="gameover-popup-container">
            <div class="popup-item align-content-end">Game Over!</div>
            <div class="popup-item align-content-center">Score: <span id="score">0</span></div>
            <div class="popup-item">
                <button class="popup-button" type="button">Try Again</button>
            </div>
        </div>
    </div>
    <div class="container"></div>
    <script src="js/script.js"></script>
</body>

</html>
